name: Native finger nav acceptance
on:
  push:
    paths: ['ChatRegression.swift', '.github/workflows/chat-regression.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wk-chat:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build WKWebView regression app
        run: |
          set -e
          mkdir -p /tmp/ChatTest.app
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          ARCH=$(uname -m)
          xcrun swiftc -parse-as-library -target "$ARCH-apple-ios17.0-simulator" -sdk "$SDK" ChatRegression.swift -o /tmp/ChatTest.app/ChatTest
          cp Sources/NOVA/nova.html /tmp/ChatTest.app/nova.html
          cat > /tmp/ChatTest.app/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?><plist version="1.0"><dict><key>CFBundleIdentifier</key><string>site.federicotaranu.nova.chattest</string><key>CFBundleExecutable</key><string>ChatTest</string><key>CFBundleName</key><string>ChatTest</string><key>CFBundleVersion</key><string>1</string><key>CFBundlePackageType</key><string>APPL</string><key>MinimumOSVersion</key><string>17.0</string><key>UILaunchScreen</key><dict/></dict></plist>
          PLIST
          codesign --force --sign - /tmp/ChatTest.app
      - name: Boot install launch and verify
        run: |
          set -e
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin);print(next(x["udid"] for v in d["devices"].values() for x in v if "iPhone" in x["name"]))')
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool NO
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl spawn "$UDID" defaults write com.apple.keyboard.preferences DidShowContinuousPathIntroduction -bool YES
          xcrun simctl spawn "$UDID" defaults write com.apple.Preferences DidShowContinuousPathIntroduction -bool YES
          xcrun simctl install "$UDID" /tmp/ChatTest.app
          mkdir -p evidence
      - name: Install native UI driver
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Real finger navigation capture
        run: |
          cat > /tmp/nav.yaml <<'FLOW'
          appId: site.federicotaranu.nova.chattest
          ---
          - launchApp
          - extendedWaitUntil:
              visible: "Profilo"
              timeout: 30000
          - takeScreenshot: evidence/nav-before
          - swipe:
              start: "82%,91%"
              end: "18%,91%"
              duration: 2000
          - takeScreenshot: evidence/nav-after
          - swipe:
              start: "18%,91%"
              end: "82%,91%"
              duration: 2000
          - takeScreenshot: evidence/nav-return
          FLOW
          UDID=$(xcrun simctl list devices booted -j | python3 -c 'import json,sys;d=json.load(sys.stdin);print(next(x["udid"] for v in d["devices"].values() for x in v))')
          xcrun simctl io "$UDID" recordVideo --codec=h264 evidence/nav-real-drag.mp4 >/tmp/nav-video.log 2>&1 &
          PID=$!
          maestro test /tmp/nav.yaml
          kill -INT "$PID" || true
          sleep 5
          kill -TERM "$PID" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NOVA-real-nav-drag
          path: evidence/
