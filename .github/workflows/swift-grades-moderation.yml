name: Swift grades, moderation and home acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  grades:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build WKWebView regression app
        run: |
          set -e
          mkdir -p /tmp/ChatTest.app
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          ARCH=$(uname -m)
          NOVA_GRADES_INTERACTION=1 python3 production_visual.py
          xcrun swiftc -D DEBUG -parse-as-library -target "$ARCH-apple-ios17.0-simulator" -sdk "$SDK" /tmp/NOVAProductionVisual.swift -o /tmp/ChatTest.app/ChatTest
          cp Sources/NOVA/nova.html /tmp/ChatTest.app/nova.html
          cat > /tmp/ChatTest.app/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?><plist version="1.0"><dict><key>CFBundleIdentifier</key><string>site.federicotaranu.nova.chattest</string><key>CFBundleExecutable</key><string>ChatTest</string><key>CFBundleName</key><string>ChatTest</string><key>CFBundleVersion</key><string>1</string><key>CFBundlePackageType</key><string>APPL</string><key>MinimumOSVersion</key><string>17.0</string><key>UILaunchScreen</key><dict/></dict></plist>
          PLIST
          codesign --force --sign - /tmp/ChatTest.app
      - name: Boot install launch and verify
        run: |
          set -e
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin);print(next(x["udid"] for v in d["devices"].values() for x in v if "iPhone" in x["name"]))')
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool NO
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" /tmp/ChatTest.app
          mkdir -p evidence
          xcrun simctl launch "$UDID" site.federicotaranu.nova.chattest
          CONTAINER=$(xcrun simctl get_app_container "$UDID" site.federicotaranu.nova.chattest data)
          for i in $(seq 1 45); do [ -f "$CONTAINER/Documents/interaction-ready" ] && break; sleep 1; done
          test -f "$CONTAINER/Documents/interaction-ready" || { xcrun simctl io "$UDID" screenshot evidence/incomplete.png; echo "Swift fixture did not appear"; exit 1; }
          xcrun simctl io "$UDID" screenshot evidence/grades-top.png
      - name: Install native UI driver
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Grades capture
        run: |
          cat > /tmp/grades.yaml <<'FLOW'
          appId: site.federicotaranu.nova.chattest
          ---
          - launchApp
          - extendedWaitUntil:
              visible:
                id: "swiftGradesAbsences"
              timeout: 30000
          - assertVisible:
              id: "swiftGradeTarget"
          - assertVisible:
              id: "swiftGradeVerdict"
          - assertVisible:
              id: "swiftGradeTrend"
          - takeScreenshot: evidence/grades-absences
          - scroll
          - takeScreenshot: evidence/grades-subjects
          FLOW
          UDID=$(xcrun simctl list devices booted -j | python3 -c 'import json,sys;d=json.load(sys.stdin);print(next(x["udid"] for v in d["devices"].values() for x in v))')
          export MAESTRO_DRIVER_STARTUP_TIMEOUT=240000
          python3 - <<'PYRUN'
          import subprocess
          try: subprocess.run(['maestro','test','/tmp/grades.yaml'],timeout=360,check=True)
          except subprocess.TimeoutExpired: raise SystemExit('UI driver exceeded 360s; acceptance incomplete')
          PYRUN
          find "$HOME/.maestro" /tmp -name 'grades-*.png' -exec cp {} evidence/ \; 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NOVA-Swift-grades
          include-hidden-files: true
          path: |
            evidence/*.png
            evidence/*.json
            /tmp/**/*.png
            /Users/runner/.maestro/**/*.png
  school:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build WKWebView regression app
        run: |
          set -e
          mkdir -p /tmp/ChatTest.app
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          ARCH=$(uname -m)
          NOVA_SCHOOL_INTERACTION=1 python3 production_visual.py
          xcrun swiftc -D DEBUG -parse-as-library -target "$ARCH-apple-ios17.0-simulator" -sdk "$SDK" /tmp/NOVAProductionVisual.swift -o /tmp/ChatTest.app/ChatTest
          cp Sources/NOVA/nova.html /tmp/ChatTest.app/nova.html
          cat > /tmp/ChatTest.app/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?><plist version="1.0"><dict><key>CFBundleIdentifier</key><string>site.federicotaranu.nova.chattest</string><key>CFBundleExecutable</key><string>ChatTest</string><key>CFBundleName</key><string>ChatTest</string><key>CFBundleVersion</key><string>1</string><key>CFBundlePackageType</key><string>APPL</string><key>MinimumOSVersion</key><string>17.0</key><key>UILaunchScreen</key><dict/></dict></plist>
          PLIST
          codesign --force --sign - /tmp/ChatTest.app
      - name: Boot install launch and verify
        run: |
          set -e
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin);print(next(x["udid"] for v in d["devices"].values() for x in v if "iPhone" in x["name"]))')
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool NO
          ok=0
          for t in 1 2 3; do
            xcrun simctl boot "$UDID" >/dev/null 2>&1 || true
            if xcrun simctl bootstatus "$UDID" -b; then ok=1; break; fi
            xcrun simctl shutdown "$UDID" >/dev/null 2>&1 || true
            sleep 10
          done
          test "$ok" = 1 || { echo "Simulator did not boot after retries"; exit 1; }
          inst=0
          for t in 1 2 3; do
            if xcrun simctl install "$UDID" /tmp/ChatTest.app; then inst=1; break; fi
            sleep 15
          done
          test "$inst" = 1 || { echo "Install failed after retries"; exit 1; }
          mkdir -p evidence
          xcrun simctl launch "$UDID" site.federicotaranu.nova.chattest
          CONTAINER=$(xcrun simctl get_app_container "$UDID" site.federicotaranu.nova.chattest data)
          for i in $(seq 1 45); do [ -f "$CONTAINER/Documents/interaction-ready" ] && break; sleep 1; done
          test -f "$CONTAINER/Documents/interaction-ready" || { xcrun simctl io "$UDID" screenshot evidence/incomplete.png; echo "Swift fixture did not appear"; exit 1; }
      - name: Install native UI driver
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: School capture
        run: |
          cat > /tmp/school.yaml <<'FLOW'
          appId: site.federicotaranu.nova.chattest
          ---
          - launchApp
          - extendedWaitUntil:
              visible:
                id: "fixtureMenuCompiti"
              timeout: 30000
          - tapOn:
              id: "fixtureMenuCompiti"
          - extendedWaitUntil:
              visible:
                id: "swiftCompitiToggle"
              timeout: 30000
          - assertVisible: "In ritardo"
          - takeScreenshot: evidence/compiti
          - tapOn: "NOVA scuola"
          - tapOn:
              id: "fixtureMenuOrario"
          - extendedWaitUntil:
              visible:
                id: "swiftOrarioLesson"
              timeout: 30000
          - takeScreenshot: evidence/orario
          - tapOn: "NOVA scuola"
          - tapOn:
              id: "fixtureMenuPagella"
          - extendedWaitUntil:
              visible:
                id: "swiftPagellaShare"
              timeout: 30000
          - assertVisible:
              id: "swiftPagellaOverall"
          - takeScreenshot: evidence/pagella
          - tapOn: "NOVA scuola"
          - tapOn:
              id: "fixtureMenuSalvati"
          - extendedWaitUntil:
              visible:
                id: "swiftSavedRow"
              timeout: 30000
          - takeScreenshot: evidence/salvati
          - tapOn: "NOVA scuola"
          - tapOn:
              id: "fixtureMenuMedie"
          - scrollUntilVisible:
              element:
                id: "swiftGradeShareRow"
              direction: DOWN
              timeout: 30000
          - takeScreenshot: evidence/medie
          - tapOn: "NOVA scuola"
          - tapOn:
              id: "fixtureMenuSondaggio"
          - extendedWaitUntil:
              visible:
                id: "swiftPollBubble"
              timeout: 30000
          - takeScreenshot: evidence/sondaggio
          - tapOn:
              id: "swiftPollOpen"
          - extendedWaitUntil:
              visible:
                id: "swiftPollQuestionField"
              timeout: 30000
          - tapOn:
              id: "swiftPollQuestionField"
          - inputText: "Gita a maggio?"
          - tapOn:
              id: "swiftPollOption0"
          - inputText: "Mare"
          - tapOn:
              id: "swiftPollOption1"
          - inputText: "Montagna"
          - takeScreenshot: evidence/sondaggio-nuovo
          - tapOn: "Annulla"
          - tapOn:
              id: "swiftChatBack"
          - tapOn:
              id: "fixtureMenuProfilo"
          - extendedWaitUntil:
              visible:
                id: "swiftProfileStato"
              timeout: 30000
          - takeScreenshot: evidence/profilo-stato
          FLOW
          UDID=$(xcrun simctl list devices booted -j | python3 -c 'import json,sys;d=json.load(sys.stdin);print(next(x["udid"] for v in d["devices"].values() for x in v))')
          export MAESTRO_DRIVER_STARTUP_TIMEOUT=240000
          set +e
          maestro test /tmp/school.yaml > /tmp/maestro-run.log 2>&1
          RC=$?
          set -e
          cat /tmp/maestro-run.log
          if [ "$RC" -ne 0 ]; then
            mkdir -p evidence/maestro-debug
            cp -R "$HOME/.maestro/tests" evidence/maestro-debug/tests 2>/dev/null || true
            xcrun simctl io "$UDID" screenshot evidence/school-fail.png || true
            exit "$RC"
          fi
          find "$HOME/.maestro" /tmp \( -name 'compiti*.png' -o -name 'orario*.png' -o -name 'pagella*.png' -o -name 'salvati*.png' -o -name 'medie*.png' -o -name 'sondaggio*.png' -o -name 'profilo*.png' \) -exec cp {} evidence/ \; 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NOVA-Swift-school
          include-hidden-files: true
          path: |
            evidence/**
            /tmp/**/*.png
            /Users/runner/.maestro/**/*.png
  moderation:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build WKWebView regression app
        run: |
          set -e
          mkdir -p /tmp/ChatTest.app
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          ARCH=$(uname -m)
          NOVA_MODERATION_INTERACTION=1 python3 production_visual.py
          xcrun swiftc -D DEBUG -parse-as-library -target "$ARCH-apple-ios17.0-simulator" -sdk "$SDK" /tmp/NOVAProductionVisual.swift -o /tmp/ChatTest.app/ChatTest
          cp Sources/NOVA/nova.html /tmp/ChatTest.app/nova.html
          cat > /tmp/ChatTest.app/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?><plist version="1.0"><dict><key>CFBundleIdentifier</key><string>site.federicotaranu.nova.chattest</string><key>CFBundleExecutable</key><string>ChatTest</string><key>CFBundleName</key><string>ChatTest</string><key>CFBundleVersion</key><string>1</string><key>CFBundlePackageType</key><string>APPL</string><key>MinimumOSVersion</key><string>17.0</string><key>UILaunchScreen</key><dict/></dict></plist>
          PLIST
          codesign --force --sign - /tmp/ChatTest.app
      - name: Boot install launch and verify
        run: |
          set -e
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin);print(next(x["udid"] for v in d["devices"].values() for x in v if "iPhone" in x["name"]))')
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool NO
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl spawn "$UDID" defaults write com.apple.keyboard.preferences DidShowContinuousPathIntroduction -bool YES
          xcrun simctl spawn "$UDID" defaults write com.apple.Preferences DidShowContinuousPathIntroduction -bool YES
          xcrun simctl install "$UDID" /tmp/ChatTest.app
          mkdir -p evidence
          xcrun simctl launch "$UDID" site.federicotaranu.nova.chattest
          CONTAINER=$(xcrun simctl get_app_container "$UDID" site.federicotaranu.nova.chattest data)
          for i in $(seq 1 60); do [ -f "$CONTAINER/Documents/interaction-ready" ] && break; sleep 1; done
          test -f "$CONTAINER/Documents/interaction-ready" || { xcrun simctl io "$UDID" screenshot evidence/incomplete.png; echo "Swift fixture did not appear"; exit 1; }
      - name: Install native UI driver
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Moderation capture
        run: |
          cat > /tmp/moderation.yaml <<'FLOW'
          appId: site.federicotaranu.nova.chattest
          ---
          - launchApp
          - extendedWaitUntil:
              visible:
                id: "swiftMessage_1"
              timeout: 30000
          - takeScreenshot: evidence/moderation-conversation
          - longPressOn:
              id: "swiftMessage_1"
          - extendedWaitUntil:
              visible: "Segnala"
              timeout: 15000
          - assertVisible: "Blocca"
          - takeScreenshot: evidence/moderation-menu
          - tapOn: "Segnala"
          - extendedWaitUntil:
              visible: "Segnala a NOVA"
              timeout: 10000
          - takeScreenshot: evidence/moderation-report
          - tapOn: "Annulla"
          - tapOn:
              id: "swiftChatSearchOpen"
          - extendedWaitUntil:
              visible:
                id: "swiftChatSearch"
              timeout: 10000
          - tapOn:
              id: "swiftChatSearch"
          - inputText: "dimostrativo"
          - extendedWaitUntil:
              visible:
                id: "swiftChatSearchCount"
              timeout: 10000
          - takeScreenshot: evidence/chat-search
          FLOW
          UDID=$(xcrun simctl list devices booted -j | python3 -c 'import json,sys;d=json.load(sys.stdin);print(next(x["udid"] for v in d["devices"].values() for x in v))')
          export MAESTRO_DRIVER_STARTUP_TIMEOUT=240000
          set +e
          maestro test /tmp/moderation.yaml > /tmp/maestro-run.log 2>&1
          RC=$?
          set -e
          cat /tmp/maestro-run.log
          if [ "$RC" -ne 0 ]; then
            mkdir -p evidence/maestro-debug
            cp -R "$HOME/.maestro/tests" evidence/maestro-debug/tests 2>/dev/null || true
            find "$HOME/Library/Logs/DiagnosticReports" -name '*.ips' -newermt '-15 minutes' -exec cp {} evidence/maestro-debug/ \; 2>/dev/null || true
            xcrun simctl io "$UDID" screenshot evidence/moderation-fail.png || true
            exit "$RC"
          fi
          find "$HOME/.maestro" /tmp -name 'moderation-*.png' -exec cp {} evidence/ \; 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NOVA-Swift-moderation
          include-hidden-files: true
          path: |
            evidence/**
            evidence/*.json
            /tmp/**/*.png
            /Users/runner/.maestro/**/*.png
  home:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build WKWebView regression app
        run: |
          set -e
          mkdir -p /tmp/ChatTest.app
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          ARCH=$(uname -m)
          NOVA_HOME_INTERACTION=1 python3 production_visual.py
          xcrun swiftc -D DEBUG -parse-as-library -target "$ARCH-apple-ios17.0-simulator" -sdk "$SDK" /tmp/NOVAProductionVisual.swift -o /tmp/ChatTest.app/ChatTest
          cp Sources/NOVA/nova.html /tmp/ChatTest.app/nova.html
          cat > /tmp/ChatTest.app/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?><plist version="1.0"><dict><key>CFBundleIdentifier</key><string>site.federicotaranu.nova.chattest</string><key>CFBundleExecutable</key><string>ChatTest</string><key>CFBundleName</key><string>ChatTest</string><key>CFBundleVersion</key><string>1</string><key>CFBundlePackageType</key><string>APPL</string><key>MinimumOSVersion</key><string>17.0</string><key>UILaunchScreen</key><dict/></dict></plist>
          PLIST
          codesign --force --sign - /tmp/ChatTest.app
      - name: Boot install launch and capture
        run: |
          set -e
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin);print(next(x["udid"] for v in d["devices"].values() for x in v if "iPhone" in x["name"]))')
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool NO
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" /tmp/ChatTest.app
          mkdir -p evidence
          xcrun simctl launch "$UDID" site.federicotaranu.nova.chattest
          CONTAINER=$(xcrun simctl get_app_container "$UDID" site.federicotaranu.nova.chattest data)
          for i in $(seq 1 90); do [ -f "$CONTAINER/Documents/interaction-ready" ] && break; sleep 1; done
          test -f "$CONTAINER/Documents/interaction-ready" || { xcrun simctl io "$UDID" screenshot evidence/incomplete.png; echo "Home fixture did not finish"; exit 1; }
          cp "$CONTAINER/Documents/production-home-exam.png" "$CONTAINER/Documents/production-profile-badges.png" "$CONTAINER/Documents/production-profile-badge-picked.png" evidence/
          cp "$CONTAINER/Documents/production-accent.png" evidence/ || true
          cp "$CONTAINER/Documents/production-home-gx.txt" evidence/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NOVA-Swift-home
          include-hidden-files: true
          path: |
            evidence/*.png
