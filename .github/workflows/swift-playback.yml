name: Swift downloaded voice playback acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wk-chat:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build WKWebView regression app
        run: |
          set -e
          mkdir -p /tmp/ChatTest.app
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          ARCH=$(uname -m)
          NOVA_PLAYBACK=1 python3 production_visual.py
          xcrun swiftc -D DEBUG -parse-as-library -target "$ARCH-apple-ios17.0-simulator" -sdk "$SDK" /tmp/NOVAProductionVisual.swift -o /tmp/ChatTest.app/ChatTest
          cp Sources/NOVA/nova.html /tmp/ChatTest.app/nova.html
          cat > /tmp/ChatTest.app/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?><plist version="1.0"><dict><key>CFBundleIdentifier</key><string>site.federicotaranu.nova.chattest</string><key>CFBundleExecutable</key><string>ChatTest</string><key>CFBundleName</key><string>ChatTest</string><key>CFBundleVersion</key><string>1</string><key>CFBundlePackageType</key><string>APPL</string><key>MinimumOSVersion</key><string>17.0</string><key>UILaunchScreen</key><dict/></dict></plist>
          PLIST
          codesign --force --sign - /tmp/ChatTest.app
      - name: Boot install launch and verify
        run: |
          set -e
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin);print(next(x["udid"] for v in d["devices"].values() for x in v if "iPhone" in x["name"]))')
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool NO
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl spawn "$UDID" defaults write com.apple.keyboard.preferences DidShowContinuousPathIntroduction -bool YES
          xcrun simctl spawn "$UDID" defaults write com.apple.Preferences DidShowContinuousPathIntroduction -bool YES
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl install "$UDID" /tmp/ChatTest.app
          mkdir -p evidence
          xcrun simctl launch "$UDID" site.federicotaranu.nova.chattest
          CONTAINER=$(xcrun simctl get_app_container "$UDID" site.federicotaranu.nova.chattest data)
          for i in $(seq 1 45); do [ -f "$CONTAINER/Documents/interaction-ready" ] && break; sleep 1; done
          test -f "$CONTAINER/Documents/interaction-ready" || { xcrun simctl io "$UDID" screenshot evidence/incomplete.png; echo "Swift fixture did not appear"; exit 1; }
          xcrun simctl io "$UDID" screenshot evidence/native-segment-rest.png
          cp "$CONTAINER/Documents/performance-checks.json" evidence/
          python3 -c 'import json;d=json.load(open("evidence/performance-checks.json"));print(d);assert len(d["checks"])==5 and all(d["checks"].values()),d'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NOVA-voice-playback
          path: evidence/
