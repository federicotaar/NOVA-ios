name: Widget verify

# Verifica funzionale del widget NOVA: decode con dati misti validi/non validi,
# stati vuoto/non valido espliciti, render reali per casa e lock screen.
# Solo manuale (workflow_dispatch).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Typecheck widget for device SDK (unmodified file)
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun swiftc -parse-as-library -target arm64-apple-ios17.0 -sdk "$SDK" \
            -typecheck Sources/NOVAWidget/NOVAWidget.swift
          echo "device typecheck ok"

      - name: Build fixture app (simulator)
        run: |
          set -e
          mkdir -p /tmp/WidgetVerify.app
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          ARCH=$(uname -m)
          # Copia CI del widget senza @main (il main e' nella fixture) e con la famiglia
          # widget letta da WidgetVerifyFamily.current invece che dall'ambiente SwiftUI
          # (EnvironmentValues.widgetFamily e' read-only, non iniettabile in un'app).
          sed -e '/^@main$/,/^}$/d' \
            -e 's/@Environment(\\.widgetFamily) var family/var family: WidgetFamily { WidgetVerifyFamily.current }/' \
            Sources/NOVAWidget/NOVAWidget.swift > /tmp/NOVAWidget-nomain.swift
          ! grep -q '@main' /tmp/NOVAWidget-nomain.swift
          ! grep -q '@Environment' /tmp/NOVAWidget-nomain.swift
          grep -c 'WidgetVerifyFamily.current' /tmp/NOVAWidget-nomain.swift
          xcrun swiftc -parse-as-library -target "$ARCH-apple-ios17.0-simulator" -sdk "$SDK" \
            /tmp/NOVAWidget-nomain.swift Tests/WidgetVerifyFixture.swift \
            -o /tmp/WidgetVerify.app/WidgetVerify
          cat > /tmp/WidgetVerify.app/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?><plist version="1.0"><dict><key>CFBundleIdentifier</key><string>site.federicotaranu.nova.widgetverify</string><key>CFBundleExecutable</key><string>WidgetVerify</string><key>CFBundleName</key><string>WidgetVerify</string><key>CFBundleVersion</key><string>1</string><key>CFBundlePackageType</key><string>APPL</string><key>MinimumOSVersion</key><string>17.0</string><key>UILaunchScreen</key><dict/></dict></plist>
          PLIST
          codesign --force --sign - /tmp/WidgetVerify.app

      - name: Boot install launch and collect results
        run: |
          set -e
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin);print(next(x["udid"] for v in d["devices"].values() for x in v if "iPhone" in x["name"]))')
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" /tmp/WidgetVerify.app
          xcrun simctl launch "$UDID" site.federicotaranu.nova.widgetverify
          CONTAINER=$(xcrun simctl get_app_container "$UDID" site.federicotaranu.nova.widgetverify data)
          for i in $(seq 1 45); do [ -f "$CONTAINER/Documents/widget-verify-done" ] && break; sleep 1; done
          test -f "$CONTAINER/Documents/widget-verify-done" || { echo "fixture did not finish"; ls -la "$CONTAINER/Documents" || true; exit 1; }
          mkdir -p evidence
          cp "$CONTAINER/Documents/widget-verify.json" evidence/
          cp "$CONTAINER/Documents"/*.png evidence/
          echo "===== widget-verify.json ====="
          cat evidence/widget-verify.json
          echo ""
          echo "===== PNG (base64) ====="
          for f in evidence/*.png; do
            echo "--- $(basename "$f") ---"
            base64 -i "$f"
            echo ""
          done

      - uses: actions/upload-artifact@v4
        with:
          name: NOVA-widget-verify
          path: evidence/

      - name: Fail if any check failed
        run: |
          python3 - evidence/widget-verify.json <<'EOF'
          import json, sys
          r = json.load(open(sys.argv[1]))
          print(f"checks: {r['total']}, failed: {r['failed']}")
          for c in r['checks']:
              if not c['ok']:
                  print('FAILED:', c['name'])
          sys.exit(1 if r['failed'] else 0)
          EOF
