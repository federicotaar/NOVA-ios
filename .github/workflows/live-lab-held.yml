name: Held local-only Live Lab device gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lab:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated lab and simulator previews
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          SIMSDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          mkdir -p /tmp/LiveLab.app evidence/Payload/LiveLab.app
          cp Tests/LiveLab/Info.plist /tmp/LiveLab.app/Info.plist
          cp Tests/LiveLab/Info.plist evidence/Payload/LiveLab.app/Info.plist
          xcrun swiftc -parse-as-library -O -target arm64-apple-ios17.0 -sdk "$SDK" Tests/LiveLab/LiveLab.swift -o evidence/Payload/LiveLab.app/LiveLab
          xcrun vtool -show-build evidence/Payload/LiveLab.app/LiveLab
          codesign --force --sign - evidence/Payload/LiveLab.app
          (cd evidence && zip -qry NOVA-Live-Lab-local-only.ipa Payload)
          xcrun swiftc -D DEBUG -parse-as-library -target "$(uname -m)-apple-ios17.0-simulator" -sdk "$SIMSDK" Tests/LiveLab/LiveLab.swift -o /tmp/LiveLab.app/LiveLab
          codesign --force --sign - /tmp/LiveLab.app
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin);print(next(x["udid"] for v in d["devices"].values() for x in v if "iPhone" in x["name"]))')
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" /tmp/LiveLab.app
          xcrun simctl launch --console "$UDID" site.federicotaranu.nova.livelab --synthetic-checks > evidence/checks.log 2>&1 &
          CHECK_PID=$!
          sleep 3
          xcrun simctl terminate "$UDID" site.federicotaranu.nova.livelab
          wait "$CHECK_PID" || true
          grep 'LIVE_LAB_CHECKS' evidence/checks.log
          ! grep 'false' evidence/checks.log
          for THEME in light dark; do
            xcrun simctl ui "$UDID" appearance "$THEME"
            for STATE in preview confirm active; do
              xcrun simctl launch "$UDID" site.federicotaranu.nova.livelab "--synthetic-$STATE"
              sleep 3
              xcrun simctl io "$UDID" screenshot "evidence/live-lab-$THEME-$STATE.png"
              xcrun simctl terminate "$UDID" site.federicotaranu.nova.livelab
            done
          done
      - name: Synthetic UI confirm cancel stop and counters
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          export PATH="$HOME/.maestro/bin:$PATH"
          cat > /tmp/lab.yaml <<'FLOW'
          appId: site.federicotaranu.nova.livelab
          ---
          - launchApp:
              stopApp: true
              arguments:
                --synthetic-confirm: true
          - assertVisible: "Avviare il test locale di posizione?"
          - takeScreenshot: evidence/live-lab-confirm-visible
          - tapOn: "Annulla"
          - assertVisible: "Avvia test locale"
          - launchApp:
              stopApp: true
              arguments:
                --synthetic-active: true
          - assertVisible: "Ferma test"
          - scrollUntilVisible:
              element:
                text: "In background"
              direction: DOWN
          - takeScreenshot: evidence/live-lab-counters
          - scrollUntilVisible:
              element:
                text: "Ferma test"
              direction: UP
          - tapOn: "Ferma test"
          - assertVisible: "Test fermato. Nessun dato inviato."
          - assertVisible: "Avvia test locale"
          - takeScreenshot: evidence/live-lab-stopped
          FLOW
          export MAESTRO_DRIVER_STARTUP_TIMEOUT=240000
          python3 - <<'RUN'
          import subprocess
          subprocess.run(['maestro','test','/tmp/lab.yaml'],timeout=360,check=True)
          RUN
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NOVA-Live-Lab-held-local-only
          path: |
            evidence/*.ipa
            evidence/*.png
            evidence/*.log
