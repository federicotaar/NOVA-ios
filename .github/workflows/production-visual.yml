name: Swift compile tests and manual visual acceptance
on:
  push:
    paths: ['.github/workflows/production-visual.yml', 'production_visual.py', 'Sources/NOVA/nova.html', 'Sources/NOVA/*.swift', 'Sources/NOVAWidget/NOVAWidget.swift']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wk-chat:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build WKWebView regression app
        run: |
          set -e
          mkdir -p /tmp/ChatTest.app
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          ARCH=$(uname -m)
          xcrun swiftc -parse-as-library -typecheck -target "$ARCH-apple-ios17.0-simulator" -sdk "$SDK" Sources/NOVAWidget/NOVAWidget.swift
          python3 production_visual.py
          swiftc -parse-as-library /tmp/SwiftStateTests.swift -o /tmp/nova-state-tests
          /tmp/nova-state-tests
          xcrun swiftc -parse-as-library -target "$ARCH-apple-ios17.0-simulator" -sdk "$SDK" /tmp/NOVAProductionVisual.swift -o /tmp/ChatTest.app/ChatTest
          cp Sources/NOVA/nova.html /tmp/ChatTest.app/nova.html
          cat > /tmp/ChatTest.app/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?><plist version="1.0"><dict><key>CFBundleIdentifier</key><string>site.federicotaranu.nova.chattest</string><key>CFBundleExecutable</key><string>ChatTest</string><key>CFBundleName</key><string>ChatTest</string><key>CFBundleVersion</key><string>1</string><key>CFBundlePackageType</key><string>APPL</string><key>MinimumOSVersion</key><string>17.0</string><key>UILaunchScreen</key><dict/></dict></plist>
          PLIST
          codesign --force --sign - /tmp/ChatTest.app
      - name: Boot install launch and verify
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -e
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin);print(next(x["udid"] for v in d["devices"].values() for x in v if "iPhone" in x["name"]))')
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool NO
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl spawn "$UDID" defaults write com.apple.keyboard.preferences DidShowContinuousPathIntroduction -bool YES
          xcrun simctl spawn "$UDID" defaults write com.apple.Preferences DidShowContinuousPathIntroduction -bool YES
          xcrun simctl install "$UDID" /tmp/ChatTest.app
          mkdir -p evidence
          xcrun simctl io "$UDID" recordVideo --codec=h264 evidence/native-motion.mp4 >/tmp/video.log 2>&1 &
          VIDEO_PID=$!
          xcrun simctl launch "$UDID" site.federicotaranu.nova.chattest
          CONTAINER=$(xcrun simctl get_app_container "$UDID" site.federicotaranu.nova.chattest data)
          for i in $(seq 1 180); do [ -f "$CONTAINER/Documents/visual-done" ] && break; sleep 1; done
          if [ ! -f "$CONTAINER/Documents/visual-done" ]; then echo "Visual fixture did not complete"; xcrun simctl io "$UDID" screenshot evidence/incomplete.png; exit 1; fi
          xcrun simctl io "$UDID" screenshot evidence/native-nav.png
          echo "$UDID" > /tmp/nova-udid
          echo "$VIDEO_PID" > /tmp/nova-video-pid
          echo "$CONTAINER" > /tmp/nova-container
          cp "$CONTAINER/Documents/production-"*.png evidence/
          cp "$CONTAINER/Documents/visual-errors.txt" evidence/ || true
          cp "$CONTAINER/Documents/native-functional.txt" evidence/ || true
          cp "$CONTAINER/Documents/profile-extras.txt" evidence/ || true
          cp "$CONTAINER/Documents/profile-focus.txt" evidence/ || true
          cp "$CONTAINER/Documents/profile-light.txt" evidence/ || true
          cp "$CONTAINER/Documents/dashboard-functional.txt" evidence/ || true
          cp "$CONTAINER/Documents/timetable-functional.txt" evidence/ || true
          cp "$CONTAINER/Documents/swift-"*.txt evidence/ || true
          cp "$CONTAINER/Documents/editing-state.txt" evidence/ || true
          cp "$CONTAINER/Documents/reaction-state.txt" evidence/ || true
          cp "$CONTAINER/Documents/onboarding-state.txt" evidence/ || true
          cp "$CONTAINER/Documents/onboarding-init.txt" evidence/ || true
          kill -INT "$VIDEO_PID" || true
          sleep 3
          rm -f evidence/*.sb-*
          for f in evidence/*txt; do echo "--- $f"; cat "$f"; done
          python3 - <<'PYTEST'
          import json, pathlib
          required=['swift-task-checks.txt','swift-sync-checks.txt','swift-social-checks.txt','swift-people-checks.txt','swift-assistant-checks.txt','swift-school-checks.txt','swift-notification-checks.txt','swift-import-origin.txt']
          for name in required:
              data=json.loads((pathlib.Path('evidence')/name).read_text())
              assert data and all(value is True for value in data.values()), (name,data)
              assert not any(key.lower() in ('exception','failed','error') for key in data), (name,data)
          PYTEST
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: NOVA-production-visual
          path: evidence/
