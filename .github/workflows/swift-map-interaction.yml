name: Swift opt-in live integration acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wk-chat:
    strategy:
      fail-fast: false
      matrix:
        theme: [light, dark]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build WKWebView regression app
        run: |
          set -e
          mkdir -p /tmp/ChatTest.app
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          ARCH=$(uname -m)
          NOVA_MAP_INTERACTION=1 python3 production_visual.py
          python3 -c 'from pathlib import Path;p=Path("/tmp/NOVAProductionVisual.swift");s=p.read_text();s=s.replace(".preferredColorScheme(.dark)",".preferredColorScheme(."+"${{ matrix.theme }}"+")");p.write_text(s)' 
          xcrun swiftc -D DEBUG -parse-as-library -target "$ARCH-apple-ios17.0-simulator" -sdk "$SDK" /tmp/NOVAProductionVisual.swift -o /tmp/ChatTest.app/ChatTest
          cp Sources/NOVA/nova.html /tmp/ChatTest.app/nova.html
          cat > /tmp/ChatTest.app/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?><plist version="1.0"><dict><key>CFBundleIdentifier</key><string>site.federicotaranu.nova.chattest</string><key>CFBundleExecutable</key><string>ChatTest</string><key>CFBundleName</key><string>ChatTest</string><key>CFBundleVersion</key><string>1</string><key>CFBundlePackageType</key><string>APPL</string><key>MinimumOSVersion</key><string>17.0</string><key>UILaunchScreen</key><dict/></dict></plist>
          PLIST
          codesign --force --sign - /tmp/ChatTest.app
      - name: Boot install launch and verify
        run: |
          set -e
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin);print(next(x["udid"] for v in d["devices"].values() for x in v if "iPhone" in x["name"]))')
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool NO
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl spawn "$UDID" defaults write com.apple.keyboard.preferences DidShowContinuousPathIntroduction -bool YES
          xcrun simctl spawn "$UDID" defaults write com.apple.Preferences DidShowContinuousPathIntroduction -bool YES
          xcrun simctl ui "$UDID" appearance "${{ matrix.theme }}"
          xcrun simctl install "$UDID" /tmp/ChatTest.app
          mkdir -p evidence
          xcrun simctl launch "$UDID" site.federicotaranu.nova.chattest
          CONTAINER=$(xcrun simctl get_app_container "$UDID" site.federicotaranu.nova.chattest data)
          for i in $(seq 1 45); do [ -f "$CONTAINER/Documents/interaction-ready" ] && break; sleep 1; done
          test -f "$CONTAINER/Documents/interaction-ready" || { xcrun simctl io "$UDID" screenshot evidence/incomplete.png; echo "Swift fixture did not appear"; exit 1; }
          xcrun simctl io "$UDID" screenshot evidence/native-segment-rest.png
      - uses: actions/upload-artifact@v4
        with:
          name: NOVA-Swift-live-rest-${{ matrix.theme }}
          path: evidence/native-segment-rest.png
      - name: Verify widget brand metadata and compile extension
        run: |
          set -e
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          ARCH=$(uname -m)
          APP=/tmp/WidgetBrand.app
          mkdir -p "$APP/PlugIns/NOVAWidget.appex"
          xcrun swiftc -parse-as-library -target "$ARCH-apple-ios17.0-simulator" -sdk "$SDK" Sources/NOVAWidget/NOVAWidget.swift -o "$APP/PlugIns/NOVAWidget.appex/NOVAWidget"
          cp NOVAWidget-Info.plist "$APP/PlugIns/NOVAWidget.appex/Info.plist"
          python3 - <<'WIDGET'
          import plistlib
          p='/tmp/WidgetBrand.app/PlugIns/NOVAWidget.appex/Info.plist';d=plistlib.load(open(p,'rb'))
          assert d['CFBundleDisplayName']=='NOVA' and d['CFBundleName']=='NOVA'
          s=open('Sources/NOVAWidget/NOVAWidget.swift').read();assert 'TEST Swift' not in s and 'NOVA TEST' not in s
          print('Widget extension compiles; brand NOVA; individual titles and kind IDs unchanged.')
          WIDGET
      - name: Install native UI driver
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Real finger navigation capture
        run: |
          cat > /tmp/nav.yaml <<'FLOW'
          appId: site.federicotaranu.nova.chattest
          ---
          - launchApp
          - assertVisible: "Persone"
          - assertVisible: "Posizioni recenti, non tracciamento continuo."
          - takeScreenshot: evidence/swift-map-full
          - swipe:
              start: 50%, 83%
              end: 50%, 58%
              duration: 600
          - assertVisible: "Grandi spostamenti a app chiusa"
          - assertVisible: "@synthetic_friend"
          - takeScreenshot: evidence/swift-map-options
          - tapOn:
              id: "novaLiveStart"
          - assertVisible: "Attivare live fino a quando lo fermi?"
          - takeScreenshot: evidence/swift-live-confirm
          - tapOn: "Annulla"
          - assertVisible: "Avvia live · fino a quando lo fermi"
          - takeScreenshot: evidence/swift-live-cancelled
          - swipe:
              start: 50%, 43%
              end: 50%, 68%
              duration: 600
          - assertNotVisible: "Grandi spostamenti a app chiusa"
          - takeScreenshot: evidence/swift-map-collapsed
          - swipe:
              start: 50%, 25%
              end: 70%, 40%
              duration: 600
          - assertNotVisible: "Grandi spostamenti a app chiusa"
          - takeScreenshot: evidence/swift-map-pan-independent
          FLOW
          UDID=$(xcrun simctl list devices booted -j | python3 -c 'import json,sys;d=json.load(sys.stdin);print(next(x["udid"] for v in d["devices"].values() for x in v))')
          xcrun simctl io "$UDID" recordVideo --codec=h264 evidence/nav-real-drag.mp4 >/tmp/nav-video.log 2>&1 &
          PID=$!
          trap 'kill -INT "$PID" 2>/dev/null || true; sleep 3; find "$HOME/.maestro" /tmp -name "*.png" -exec cp {} evidence/ \; 2>/dev/null || true; CONTAINER=$(xcrun simctl get_app_container "$UDID" site.federicotaranu.nova.chattest data); cp "$CONTAINER/Documents/swift-root-state.json" "$CONTAINER/Documents/map-consent-checks.json" evidence/ 2>/dev/null || true' EXIT
          export MAESTRO_DRIVER_STARTUP_TIMEOUT=240000
          python3 - <<'PYRUN'
          import subprocess
          try: subprocess.run(['maestro','test','/tmp/nav.yaml'],timeout=360,check=True)
          except subprocess.TimeoutExpired: raise SystemExit('UI driver exceeded360s; acceptance incomplete')
          PYRUN
          find "$HOME/.maestro" /tmp -name 'swift-*.png' -exec cp {} evidence/ \; 2>/dev/null || true
          CONTAINER=$(xcrun simctl get_app_container "$UDID" site.federicotaranu.nova.chattest data)
          cp "$CONTAINER/Documents/map-consent-checks.json" evidence/
          python3 -c 'import json;d=json.load(open("evidence/map-consent-checks.json"));assert all(d.values()),d;print(d)'
          find "$HOME/.maestro" /tmp -name 'swift-*.png' -exec cp {} evidence/ \; 2>/dev/null || true
          kill -INT "$PID" || true
          sleep 5
          kill -TERM "$PID" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NOVA-Swift-live-integration-${{ matrix.theme }}
          include-hidden-files: true
          path: |
            evidence/*.png
            evidence/*.mp4
            evidence/*.json
            /tmp/**/*.png
            /tmp/.maestro/**/*.png
            /Users/runner/.maestro/**/*.png
            /Users/runner/.maestro/**/*.json
