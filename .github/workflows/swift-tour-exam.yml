name: Swift tour and group exam acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tour:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build WKWebView regression app
        run: |
          set -e
          mkdir -p /tmp/ChatTest.app
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          ARCH=$(uname -m)
          NOVA_TOUR_INTERACTION=1 python3 production_visual.py
          xcrun swiftc -D DEBUG -parse-as-library -target "$ARCH-apple-ios17.0-simulator" -sdk "$SDK" /tmp/NOVAProductionVisual.swift -o /tmp/ChatTest.app/ChatTest
          cp Sources/NOVA/nova.html /tmp/ChatTest.app/nova.html
          cat > /tmp/ChatTest.app/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?><plist version="1.0"><dict><key>CFBundleIdentifier</key><string>site.federicotaranu.nova.chattest</string><key>CFBundleExecutable</key><string>ChatTest</string><key>CFBundleName</key><string>ChatTest</string><key>CFBundleVersion</key><string>1</string><key>CFBundlePackageType</key><string>APPL</string><key>MinimumOSVersion</key><string>17.0</string><key>UILaunchScreen</key><dict/></dict></plist>
          PLIST
          codesign --force --sign - /tmp/ChatTest.app
      - name: Boot install launch and verify
        run: |
          set -e
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin);print(next(x["udid"] for v in d["devices"].values() for x in v if "iPhone" in x["name"]))')
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool NO
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" /tmp/ChatTest.app
          mkdir -p evidence
          xcrun simctl launch "$UDID" site.federicotaranu.nova.chattest
          CONTAINER=$(xcrun simctl get_app_container "$UDID" site.federicotaranu.nova.chattest data)
          for i in $(seq 1 45); do [ -f "$CONTAINER/Documents/interaction-ready" ] && break; sleep 1; done
          test -f "$CONTAINER/Documents/interaction-ready" || { xcrun simctl io "$UDID" screenshot evidence/incomplete.png; echo "Swift fixture did not appear"; exit 1; }
          xcrun simctl io "$UDID" screenshot evidence/tour-first.png
      - name: Install native UI driver
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Tour walkthrough capture
        run: |
          cat > /tmp/tour.yaml <<'FLOW'
          appId: site.federicotaranu.nova.chattest
          ---
          - launchApp
          - extendedWaitUntil:
              visible:
                id: "swiftTourCard0"
              timeout: 30000
          - assertVisible: "Tutto il giorno in una schermata"
          - takeScreenshot: evidence/tour-card-0
          - tapOn:
              id: "swiftTourNext"
          - extendedWaitUntil:
              visible:
                id: "swiftTourCard1"
              timeout: 15000
          - assertVisible: "Voti e compiti dal registro"
          - takeScreenshot: evidence/tour-card-1
          - tapOn:
              id: "swiftTourNext"
          - extendedWaitUntil:
              visible:
                id: "swiftTourCard2"
              timeout: 15000
          - assertVisible: "Chat e gruppi di classe"
          - takeScreenshot: evidence/tour-card-2
          - tapOn:
              id: "swiftTourNext"
          - extendedWaitUntil:
              visible:
                id: "swiftTourCard3"
              timeout: 15000
          - assertVisible: "Mappa e profilo"
          - takeScreenshot: evidence/tour-card-3
          - tapOn:
              id: "swiftTourStart"
          FLOW
          UDID=$(xcrun simctl list devices booted -j | python3 -c 'import json,sys;d=json.load(sys.stdin);print(next(x["udid"] for v in d["devices"].values() for x in v))')
          trap 'CONTAINER=$(xcrun simctl get_app_container "$UDID" site.federicotaranu.nova.chattest data); cp "$CONTAINER/Documents/swift-root-state.json" evidence/ 2>/dev/null || true' EXIT
          export MAESTRO_DRIVER_STARTUP_TIMEOUT=240000
          python3 - <<'PYRUN'
          import subprocess
          try: subprocess.run(['maestro','test','/tmp/tour.yaml'],timeout=360,check=True)
          except subprocess.TimeoutExpired: raise SystemExit('UI driver exceeded 360s; acceptance incomplete')
          PYRUN
          find "$HOME/.maestro" /tmp -name 'tour-*.png' -exec cp {} evidence/ \; 2>/dev/null || true
          sleep 2
          CONTAINER=$(xcrun simctl get_app_container "$UDID" site.federicotaranu.nova.chattest data)
          cp "$CONTAINER/Documents/swift-root-state.json" evidence/
          python3 - <<'VERIFY'
          import json
          x=json.load(open('evidence/swift-root-state.json'))
          assert x.get('tourSeen')==1 and not x.get('tourPending'),x
          assert not x.get('acct') and not x.get('locShare') and not x.get('bgLoc'),x
          VERIFY
          xcrun simctl io "$UDID" screenshot evidence/tour-finished.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NOVA-Swift-tour
          include-hidden-files: true
          path: |
            evidence/*.png
            evidence/*.json
            /tmp/**/*.png
            /Users/runner/.maestro/**/*.png
  group-exam:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build WKWebView regression app
        run: |
          set -e
          mkdir -p /tmp/ChatTest.app
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          ARCH=$(uname -m)
          NOVA_GROUP_EXAM=1 python3 production_visual.py
          xcrun swiftc -D DEBUG -parse-as-library -target "$ARCH-apple-ios17.0-simulator" -sdk "$SDK" /tmp/NOVAProductionVisual.swift -o /tmp/ChatTest.app/ChatTest
          cp Sources/NOVA/nova.html /tmp/ChatTest.app/nova.html
          cat > /tmp/ChatTest.app/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?><plist version="1.0"><dict><key>CFBundleIdentifier</key><string>site.federicotaranu.nova.chattest</string><key>CFBundleExecutable</key><string>ChatTest</string><key>CFBundleName</key><string>ChatTest</string><key>CFBundleVersion</key><string>1</string><key>CFBundlePackageType</key><string>APPL</string><key>MinimumOSVersion</key><string>17.0</string><key>UILaunchScreen</key><dict/></dict></plist>
          PLIST
          codesign --force --sign - /tmp/ChatTest.app
      - name: Boot install launch and verify
        run: |
          set -e
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin);print(next(x["udid"] for v in d["devices"].values() for x in v if "iPhone" in x["name"]))')
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool NO
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl spawn "$UDID" defaults write com.apple.keyboard.preferences DidShowContinuousPathIntroduction -bool YES
          xcrun simctl spawn "$UDID" defaults write com.apple.Preferences DidShowContinuousPathIntroduction -bool YES
          xcrun simctl install "$UDID" /tmp/ChatTest.app
          mkdir -p evidence
          xcrun simctl launch "$UDID" site.federicotaranu.nova.chattest
          CONTAINER=$(xcrun simctl get_app_container "$UDID" site.federicotaranu.nova.chattest data)
          for i in $(seq 1 45); do [ -f "$CONTAINER/Documents/interaction-ready" ] && break; sleep 1; done
          test -f "$CONTAINER/Documents/interaction-ready" || { xcrun simctl io "$UDID" screenshot evidence/incomplete.png; echo "Swift fixture did not appear"; exit 1; }
          xcrun simctl io "$UDID" screenshot evidence/exam-first.png
      - name: Install native UI driver
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Group exam edit capture
        run: |
          cat > /tmp/exam.yaml <<'FLOW'
          appId: site.federicotaranu.nova.chattest
          ---
          - launchApp
          - extendedWaitUntil:
              visible:
                id: "swiftGroupExamChip"
              timeout: 30000
          - assertVisible: "VERIFICA Matematica · tra 5 giorni"
          - takeScreenshot: evidence/exam-chip
          - tapOn:
              id: "swiftGroupExamEdit"
          - extendedWaitUntil:
              visible:
                id: "swiftExamSubject"
              timeout: 15000
          - takeScreenshot: evidence/exam-editor
          - tapOn:
              id: "swiftExamSubject"
          - eraseText: 50
          - inputText: "Scienze"
          - tapOn:
              id: "swiftExamSave"
          - extendedWaitUntil:
              visible: "VERIFICA Scienze · tra 5 giorni"
              timeout: 20000
          - takeScreenshot: evidence/exam-updated
          FLOW
          UDID=$(xcrun simctl list devices booted -j | python3 -c 'import json,sys;d=json.load(sys.stdin);print(next(x["udid"] for v in d["devices"].values() for x in v))')
          trap 'CONTAINER=$(xcrun simctl get_app_container "$UDID" site.federicotaranu.nova.chattest data); cp "$CONTAINER/Documents/group-exam-sent.json" evidence/ 2>/dev/null || true' EXIT
          export MAESTRO_DRIVER_STARTUP_TIMEOUT=240000
          python3 - <<'PYRUN'
          import subprocess
          try: subprocess.run(['maestro','test','/tmp/exam.yaml'],timeout=360,check=True)
          except subprocess.TimeoutExpired: raise SystemExit('UI driver exceeded 360s; acceptance incomplete')
          PYRUN
          find "$HOME/.maestro" /tmp -name 'exam-*.png' -exec cp {} evidence/ \; 2>/dev/null || true
          sleep 2
          CONTAINER=$(xcrun simctl get_app_container "$UDID" site.federicotaranu.nova.chattest data)
          cp "$CONTAINER/Documents/group-exam-sent.json" evidence/
          python3 - <<'VERIFY'
          import json
          x=json.load(open('evidence/group-exam-sent.json'))
          assert x.get('subject')=='Scienze' and x.get('at',0)>0,x
          VERIFY
          xcrun simctl io "$UDID" screenshot evidence/exam-finished.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NOVA-Swift-group-exam
          include-hidden-files: true
          path: |
            evidence/*.png
            evidence/*.json
            /tmp/**/*.png
            /Users/runner/.maestro/**/*.png
