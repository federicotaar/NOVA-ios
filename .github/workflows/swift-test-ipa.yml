name: Build held Swift test IPA

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: swift-test-ipa
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project zip (first run only)
        run: |
          set -e
          ZIP="$(ls ./*NOVA-ios.zip 2>/dev/null | head -n1 || true)"
          if [ -n "$ZIP" ]; then
            ditto -x -k "$ZIP" unpacked
            cp -R unpacked/NOVA-ios/ ./
            rm -rf unpacked "$ZIP"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Unpack NOVA-ios project sources"
            git push
          fi

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Install xtool
        run: |
          set -e
          for i in 1 2 3; do
            curl -fSL --retry 3 -o /tmp/xtool.app.zip https://github.com/xtool-org/xtool/releases/download/1.17.0/xtool.app.zip && break
            sleep 5
          done
          ls -la /tmp/xtool.app.zip
          ditto -x -k /tmp/xtool.app.zip /tmp/xtool
          echo "/tmp/xtool/xtool.app/Contents/Resources/bin" >> "$GITHUB_PATH"
          xtool --version || true

      - name: Generate app icon (black background, white N)
        run: |
          set -e
          mkdir -p Resources
          base64 -D -i assets/icon.b64 -o Resources/icon1024.png
          sips -z 120 120 Resources/icon1024.png --out "Resources/AppIcon60x60@2x.png"
          sips -z 180 180 Resources/icon1024.png --out "Resources/AppIcon60x60@3x.png"
          sips -z 152 152 Resources/icon1024.png --out "Resources/AppIcon76x76@2x~ipad.png"
          sips -z 167 167 Resources/icon1024.png --out "Resources/AppIcon83.5x83.5@2x~ipad.png"
          ls -la Resources

      - name: Stamp release version into Info plists
        run: |
          BUILD_TAG="$(grep -o 'NOVA build [0-9][0-9.-]*' Sources/NOVA/nova.html | head -n1 | sed 's/NOVA build //')"
          if [ -n "$BUILD_TAG" ]; then
            SHORT="$(echo "$BUILD_TAG" | cut -d. -f1-3)"
            VINT="$(echo "$BUILD_TAG" | awk -F. '{printf "%02d%02d",$3,$4}')"
            for P in NOVA-Info.plist NOVAWidget-Info.plist; do
              /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $SHORT" "$P"
              /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VINT" "$P"
              /usr/libexec/PlistBuddy -c "Set :NOVAReleaseLabel $BUILD_TAG" "$P"
            done
          fi

      - name: Build unsigned IPA
        run: |
          set -e
          test -f .github/swift-test-approved || { echo "Swift integrated gates not approved"; exit 1; }
          xtool dev build --ipa -c release
          IPA="$(ls xtool/*.ipa | head -n1)"
          mkdir /tmp/nova-sdk26
          unzip -q "$IPA" -d /tmp/nova-sdk26
          APP=/tmp/nova-sdk26/Payload/NOVA.app
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          sed 's/let bundle = Bundle.module/let bundle = Bundle.main/' Sources/NOVA/NOVAApp.swift > /tmp/NOVAProduction.swift
          xcrun swiftc -D NOVA_SWIFT_TEST -parse-as-library -O -target arm64-apple-ios17.0 -sdk "$SDK" /tmp/NOVAProduction.swift $(find Sources/NOVA -maxdepth 1 -name '*.swift' ! -name NOVAApp.swift) -o "$APP/NOVA"
          cp Sources/NOVA/nova.html "$APP/nova.html"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Nova" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NOVASwiftTestBuild bool true" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :DTSDKName string iphoneos$SDK_VERSION" "$APP/Info.plist"
          xcrun vtool -show-build "$APP/NOVA"
          xcrun vtool -show-build "$APP/NOVA" | grep -E 'sdk[[:space:]]+26'
          codesign --force --sign - "$APP"
          rm "$IPA"
          (cd /tmp/nova-sdk26 && zip -qry "$GITHUB_WORKSPACE/$IPA" Payload)


      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-unsigned-ipa
          path: xtool/*.ipa

      - name: Publish release with IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          IPA="$(ls xtool/*.ipa | head -n1)"
          # Ogni build tag (da nova.html, es. 2026.10.23.3) diventa la SUA release:
          # i vecchi pacchetti restano, niente viene sovrascritto tra versioni diverse.
          BUILD_TAG="$(grep -o 'NOVA build [0-9][0-9.-]*' Sources/NOVA/nova.html | head -n1 | sed 's/NOVA build //')"
          if [ -z "$BUILD_TAG" ]; then BUILD_TAG="dev.${{ github.run_number }}"; fi
          REL="v$BUILD_TAG"
          # Immutabilita': una release pubblicata non viene MAI sovrascritta.
          # Se il tag esiste gia', la build vale solo come controllo di compilazione.
          if gh release view "$REL" >/dev/null 2>&1; then
            echo "Release $REL gia' pubblicata: salto l'upload (immutabilita'). Incrementa il tag 'NOVA build' in nova.html per una nuova versione."
            exit 0
          fi
          cp "$IPA" "NOVA-$BUILD_TAG.ipa"
          gh release create "$REL" --latest --title "NOVA $BUILD_TAG TEST Swift (unsigned ipa)" --notes "Versione di prova Swift, non versione definitiva. Importa i dati solo dopo conferma, senza cancellare memoria precedente e con copia di recupero. Installa sopra la stessa app senza eliminarla. Verifiche iPhone fisico, servizi reali, Face ID e background ancora richieste."
          gh release upload "$REL" "$IPA" "NOVA-$BUILD_TAG.ipa"
