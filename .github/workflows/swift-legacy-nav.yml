name: NOVA legacy navigation fallback

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  legacy-nav:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build legacy nav fixture apps
        run: |
          set -e
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          ARCH=$(uname -m)
          for VARIANT in styled plain; do
            mkdir -p "/tmp/NavTest-$VARIANT.app"
            if [ "$VARIANT" = plain ]; then export NOVA_LEGACY_NAV_PLAIN=1; else unset NOVA_LEGACY_NAV_PLAIN; fi
            NOVA_LEGACY_NAV=1 python3 production_visual.py
            xcrun swiftc -D DEBUG -parse-as-library -target "$ARCH-apple-ios17.0-simulator" -sdk "$SDK" /tmp/NOVAProductionVisual.swift -o "/tmp/NavTest-$VARIANT.app/NavTest"
            cp Sources/NOVA/nova.html "/tmp/NavTest-$VARIANT.app/nova.html"
            sed "s/BUNDLEID/site.federicotaranu.nova.navtest.$VARIANT/" > "/tmp/NavTest-$VARIANT.app/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?><plist version="1.0"><dict><key>CFBundleIdentifier</key><string>BUNDLEID</string><key>CFBundleExecutable</key><string>NavTest</string><key>CFBundleName</key><string>NavTest</string><key>CFBundleVersion</key><string>1</string><key>CFBundlePackageType</key><string>APPL</string><key>MinimumOSVersion</key><string>17.0</string><key>UILaunchScreen</key><dict/></dict></plist>
          PLIST
            codesign --force --sign - "/tmp/NavTest-$VARIANT.app"
          done
      - name: Capture screenshots
        run: |
          set -e
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin);print(next(x["udid"] for v in d["devices"].values() for x in v if "iPhone" in x["name"]))')
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool NO
          xcrun simctl shutdown "$UDID" 2>/dev/null || true
          xcrun simctl erase "$UDID" 2>/dev/null || true
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          mkdir -p evidence
          for VARIANT in styled plain; do
            BID="site.federicotaranu.nova.navtest.$VARIANT"
            xcrun simctl install "$UDID" "/tmp/NavTest-$VARIANT.app"
            CONTAINER=$(xcrun simctl get_app_container "$UDID" "$BID" data)
            for APPEARANCE in light dark; do
              xcrun simctl ui "$UDID" appearance "$APPEARANCE"
              xcrun simctl terminate "$UDID" "$BID" 2>/dev/null || true
              rm -f "$CONTAINER/Documents/interaction-ready" "$CONTAINER/Documents/legacy-nav-tapped" "$CONTAINER/Documents/legacy-nav-checks.txt" "$CONTAINER/Documents/tap-now" "$CONTAINER/Documents/scroll-now" "$CONTAINER/Documents/scrolled-now" "$CONTAINER/Documents/banner-now" "$CONTAINER/Documents/banner-shown" "$CONTAINER/Documents/dismissed-now" "$CONTAINER/Documents/dismissed-shown" "$CONTAINER/Documents/weather-now" "$CONTAINER/Documents/weather-shown" "$CONTAINER/Documents/weather-back-now" "$CONTAINER/Documents/weather-back-shown"
              xcrun simctl launch "$UDID" "$BID" > /dev/null
              for i in $(seq 1 60); do [ -f "$CONTAINER/Documents/interaction-ready" ] && break; sleep 1; done
              test -f "$CONTAINER/Documents/interaction-ready" || { xcrun simctl io "$UDID" screenshot "evidence/incomplete-$VARIANT-$APPEARANCE.png"; echo "fixture did not appear for $VARIANT $APPEARANCE"; exit 1; }
              sleep 2
              xcrun simctl io "$UDID" screenshot "evidence/legacy-nav-$VARIANT-$APPEARANCE-home.png"
              touch "$CONTAINER/Documents/scroll-now"
              for i in $(seq 1 30); do [ -f "$CONTAINER/Documents/scrolled-now" ] && break; sleep 1; done
              test -f "$CONTAINER/Documents/scrolled-now" || { echo "scroll check missing for $VARIANT $APPEARANCE"; exit 1; }
              xcrun simctl io "$UDID" screenshot "evidence/legacy-nav-$VARIANT-$APPEARANCE-home-bottom.png"
              touch "$CONTAINER/Documents/tap-now"
              for i in $(seq 1 30); do [ -f "$CONTAINER/Documents/legacy-nav-tapped" ] && break; sleep 1; done
              test -f "$CONTAINER/Documents/legacy-nav-tapped" || { echo "tap check missing for $VARIANT $APPEARANCE"; exit 1; }
              xcrun simctl io "$UDID" screenshot "evidence/legacy-nav-$VARIANT-$APPEARANCE-chat.png"
              cp "$CONTAINER/Documents/legacy-nav-checks.txt" "evidence/legacy-nav-$VARIANT-$APPEARANCE-checks.txt"
              xcrun simctl spawn "$UDID" defaults delete "site.federicotaranu.nova.navtest.$VARIANT" "nova.dismissed-release.2026.10.29.8" || true
              touch "$CONTAINER/Documents/banner-now"
              for i in $(seq 1 30); do [ -f "$CONTAINER/Documents/banner-shown" ] && break; sleep 1; done
              test -f "$CONTAINER/Documents/banner-shown" || { echo "banner check missing for $VARIANT $APPEARANCE"; exit 1; }
              xcrun simctl io "$UDID" screenshot "evidence/legacy-nav-$VARIANT-$APPEARANCE-banner.png"
              xcrun simctl spawn "$UDID" defaults write "site.federicotaranu.nova.navtest.$VARIANT" "nova.dismissed-release.2026.10.29.8" -bool true
              touch "$CONTAINER/Documents/dismissed-now"
              for i in $(seq 1 30); do [ -f "$CONTAINER/Documents/dismissed-shown" ] && break; sleep 1; done
              test -f "$CONTAINER/Documents/dismissed-shown" || { echo "dismissed check missing for $VARIANT $APPEARANCE"; exit 1; }
              xcrun simctl io "$UDID" screenshot "evidence/legacy-nav-$VARIANT-$APPEARANCE-dismissed.png"
              touch "$CONTAINER/Documents/weather-now"
              for i in $(seq 1 45); do [ -f "$CONTAINER/Documents/weather-shown" ] && break; sleep 1; done
              test -f "$CONTAINER/Documents/weather-shown" || { ls "$CONTAINER/Documents"; echo "weather check missing for $VARIANT $APPEARANCE"; exit 1; }
              xcrun simctl io "$UDID" screenshot "evidence/legacy-nav-$VARIANT-$APPEARANCE-weather.png"
              touch "$CONTAINER/Documents/weather-back-now"
              for i in $(seq 1 30); do [ -f "$CONTAINER/Documents/weather-back-shown" ] && break; sleep 1; done
              test -f "$CONTAINER/Documents/weather-back-shown" || { echo "weather back check missing for $VARIANT $APPEARANCE"; exit 1; }
              xcrun simctl io "$UDID" screenshot "evidence/legacy-nav-$VARIANT-$APPEARANCE-weather-back.png"
              python3 -c "import json;c=json.load(open('evidence/legacy-nav-$VARIANT-$APPEARANCE-checks.txt'));assert c.get('surfaceFound') and c.get('tabSwitched') and c.get('scrolledToBottom'),c;print('PASS surface+tap+scroll','$VARIANT','$APPEARANCE',c)"
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NOVA-legacy-nav
          path: evidence/
      - name: Publish evidence branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ev-tmp 2>/dev/null || git checkout -B ev-tmp
          git rm -rf . 2>/dev/null || true
          cp evidence/* . 2>/dev/null || true
          git add -A
          git commit -m "Evidence for run $GITHUB_RUN_ID" || true
          git push -f origin ev-tmp:legacy-nav-evidence
