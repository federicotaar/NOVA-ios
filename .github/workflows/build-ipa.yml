name: Build unsigned IPA

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ipa
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project zip (first run only)
        run: |
          set -e
          ZIP="$(ls ./*NOVA-ios.zip 2>/dev/null | head -n1 || true)"
          if [ -n "$ZIP" ]; then
            ditto -x -k "$ZIP" unpacked
            cp -R unpacked/NOVA-ios/ ./
            rm -rf unpacked "$ZIP"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Unpack NOVA-ios project sources"
            git push
          fi

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Install xtool
        run: |
          set -e
          for i in 1 2 3; do
            curl -fSL --retry 3 -o /tmp/xtool.app.zip https://github.com/xtool-org/xtool/releases/download/1.17.0/xtool.app.zip && break
            sleep 5
          done
          ls -la /tmp/xtool.app.zip
          ditto -x -k /tmp/xtool.app.zip /tmp/xtool
          echo "/tmp/xtool/xtool.app/Contents/Resources/bin" >> "$GITHUB_PATH"
          xtool --version || true

      - name: Generate app icon (black background, white N)
        run: |
          set -e
          mkdir -p Resources
          base64 -D -i assets/icon.b64 -o Resources/icon1024.png
          sips -z 120 120 Resources/icon1024.png --out "Resources/AppIcon60x60@2x.png"
          sips -z 180 180 Resources/icon1024.png --out "Resources/AppIcon60x60@3x.png"
          sips -z 152 152 Resources/icon1024.png --out "Resources/AppIcon76x76@2x~ipad.png"
          sips -z 167 167 Resources/icon1024.png --out "Resources/AppIcon83.5x83.5@2x~ipad.png"
          ls -la Resources

      - name: Build unsigned IPA
        run: xtool dev build --ipa -c release

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-unsigned-ipa
          path: xtool/*.ipa

      - name: Publish release with IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          IPA="$(ls xtool/*.ipa | head -n1)"
          # Ogni build tag (da nova.html, es. 2026.10.23.3) diventa la SUA release:
          # i vecchi pacchetti restano, niente viene sovrascritto tra versioni diverse.
          BUILD_TAG="$(grep -o 'NOVA build [0-9][0-9.-]*' Sources/NOVA/nova.html | head -n1 | sed 's/NOVA build //')"
          if [ -z "$BUILD_TAG" ]; then BUILD_TAG="dev.${{ github.run_number }}"; fi
          REL="v$BUILD_TAG"
          cp "$IPA" "NOVA-$BUILD_TAG.ipa"
          gh release view "$REL" >/dev/null 2>&1 || gh release create "$REL" --title "NOVA $BUILD_TAG (unsigned ipa)" --notes "NOVA.ipa non firmato, build $BUILD_TAG. Installa con AltStore o Sideloadly. Ultima build sempre qui: https://github.com/federicotaranudev/NOVA-ios/releases/latest/download/NOVA.ipa"
          gh release upload "$REL" "$IPA" "NOVA-$BUILD_TAG.ipa" --clobber

