name: Build unsigned IPA

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ipa
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project zip (first run only)
        run: |
          set -e
          ZIP="$(ls ./*NOVA-ios.zip 2>/dev/null | head -n1 || true)"
          if [ -n "$ZIP" ]; then
            ditto -x -k "$ZIP" unpacked
            cp -R unpacked/NOVA-ios/ ./
            rm -rf unpacked "$ZIP"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Unpack NOVA-ios project sources"
            git push
          fi

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Install xtool
        run: |
          curl -sL -o /tmp/xtool.app.zip https://github.com/xtool-org/xtool/releases/latest/download/xtool.app.zip
          ditto -x -k /tmp/xtool.app.zip /tmp/xtool
          echo "/tmp/xtool/xtool.app/Contents/Resources/bin" >> "$GITHUB_PATH"

      - name: Build unsigned IPA
        run: xtool dev build --ipa -c release

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-unsigned-ipa
          path: ./*.ipa

      - name: Publish release with IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IPA="$(ls ./*.ipa | head -n1)"
          gh release view v1.0 >/dev/null 2>&1 || gh release create v1.0 --title "NOVA v1.0 (unsigned ipa)" --notes "NOVA.ipa non firmato. Installa con AltStore o Sideloadly."
          gh release upload v1.0 "$IPA" --clobber
